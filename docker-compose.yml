services:
  # ── PostgreSQL 16 ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: optimizarep_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: optimizarep
      POSTGRES_PASSWORD: optimizarep_dev
      POSTGRES_DB: optimizarep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimizarep"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
